<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="14ef5819-dba3-44c9-9edd-3bd5f68d60b5"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找不到页面 | SyServer</title>
    <link rel="stylesheet" href="styles.css?v=20260707">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== iOS 风格 404 ===== */
        .ios-404 {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 极淡的径向光晕，营造空间感而不喧宾夺主 */
        .ios-404::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse 50% 40% at 50% 45%, rgba(41, 151, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .ios-404-inner {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }

        /* 超大轻量 404，iOS 系统缺失页面的核心视觉 */
        .ios-404-code {
            font-size: clamp(7rem, 22vw, 11rem);
            font-weight: 200;
            line-height: 0.95;
            letter-spacing: -0.04em;
            color: #f5f5f7;
            margin: 0 0 1.5rem;
            opacity: 0;
            transform: translateY(24px);
            animation: iosFadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
        }

        .ios-404-title {
            font-size: clamp(1.25rem, 4vw, 1.625rem);
            font-weight: 600;
            color: #f5f5f7;
            margin: 0 0 0.75rem;
            letter-spacing: -0.01em;
            opacity: 0;
            transform: translateY(20px);
            animation: iosFadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
        }

        .ios-404-desc {
            font-size: 1.0625rem;
            font-weight: 400;
            color: #a1a1a6;
            line-height: 1.5;
            margin: 0 auto 2.75rem;
            max-width: 360px;
            opacity: 0;
            transform: translateY(20px);
            animation: iosFadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }

        /* 按钮组：iOS 风格圆角胶囊，主按钮亮色，次按钮毛玻璃 */
        .ios-404-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            animation: iosFadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
        }

        .ios-404-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            max-width: 320px;
            padding: 0.9375rem 1.75rem;
            font-family: inherit;
            font-size: 1.0625rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 980px;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.3s ease,
                        opacity 0.3s ease;
        }

        .ios-404-btn-primary {
            background: #2997ff;
            color: #ffffff;
        }

        .ios-404-btn-primary:hover {
            background: #0a84ff;
            transform: scale(1.02);
        }

        .ios-404-btn-primary:active {
            transform: scale(0.98);
        }

        .ios-404-btn-ghost {
            background: rgba(255, 255, 255, 0.08);
            color: #2997ff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        .ios-404-btn-ghost:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }

        .ios-404-btn-ghost:active {
            transform: scale(0.98);
        }

        .ios-404-btn svg {
            width: 18px;
            height: 18px;
        }

        @keyframes iosFadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .ios-404-code,
            .ios-404-title,
            .ios-404-desc,
            .ios-404-actions {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="ios-404">
        <div class="ios-404-inner">
            <h1 class="ios-404-code">404</h1>
            <h2 class="ios-404-title">找不到该页面</h2>
            <p class="ios-404-desc">你寻找的页面可能已被移除、改名，或暂时不可用。</p>
            <div class="ios-404-actions">
                <a href="index.html" class="ios-404-btn ios-404-btn-primary">
                    返回首页
                </a>
                <a href="javascript:history.back()" class="ios-404-btn ios-404-btn-ghost">
                    返回上一页
                </a>
            </div>
        </div>
    </main>
</body>
</html>
